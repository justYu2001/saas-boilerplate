name: saas-boilerplate

# Local development database.
#
#   docker compose up -d      start Postgres + the Neon HTTP proxy
#   docker compose down       stop both containers
#   docker compose down -v    stop and wipe the database volume
#
# `postgres` is reachable directly on localhost:5432 (used by drizzle-kit), and
# through the Neon HTTP proxy on db.localtest.me:4444 (used by the app via
# `drizzle-orm/neon-http`). `db.localtest.me` resolves to 127.0.0.1.
services:
  postgres:
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: saas-boilerplate
    ports:
      - "5432:5432"
    volumes:
      # postgres:18+ stores data in a major-version subdirectory, so the mount
      # goes at /var/lib/postgresql rather than /var/lib/postgresql/data.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d saas-boilerplate"]
      interval: 5s
      timeout: 5s
      retries: 10

  neon-http-proxy:
    image: ghcr.io/timowilhelm/local-neon-http-proxy:main@sha256:cd2ae14edf2feafbc3330492de5c80506f77274c3bd013154cdef697bdeb768a
    restart: unless-stopped
    environment:
      PG_CONNECTION_STRING: postgres://postgres:password@postgres:5432/saas-boilerplate
    ports:
      - "4444:4444"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
