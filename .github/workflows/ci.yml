name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  supply-chain:
    name: Supply chain checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install (frozen lockfile, supply-chain policies enforced)
        run: pnpm install --frozen-lockfile

      - name: Audit for known vulnerabilities
        run: pnpm audit --audit-level=high
        continue-on-error: true

  lint-typecheck:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    needs: supply-chain
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # next lint loads next.config.js, which imports src/env.js. SKIP_ENV_VALIDATION
      # bypasses the real env schema check here since CI has no .env.
      - run: pnpm check
        env:
          SKIP_ENV_VALIDATION: "1"

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: supply-chain
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # No SKIP_ENV_VALIDATION here: vitest.config.ts already injects its own
      # dummy values for the vars tests actually touch.
      - run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: supply-chain
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `next build` sets NODE_ENV=production, which makes BETTER_AUTH_SECRET
      # required, and it actually executes route modules while collecting page
      # data for /api/trpc/[trpc] — so SKIP_ENV_VALIDATION isn't enough here
      # (it skips the schema check but leaves the vars undefined, and code
      # further down calls `new URL()` on them). Dummy values instead, same
      # ones vitest.config.ts already uses for tests.
      - run: pnpm build
        env:
          BETTER_AUTH_URL: "http://localhost:3000"
          BETTER_AUTH_SECRET: "test-better-auth-secret-32-characters-long"
          BETTER_AUTH_GOOGLE_CLIENT_ID: "test-client-id"
          BETTER_AUTH_GOOGLE_CLIENT_SECRET: "test-client-secret"
          DATABASE_URL: "postgres://user:password@localhost:5432/test"
          RESEND_API_KEY: "test-resend-api-key"
          EMAIL_FROM: "Test <login@test.example>"
          NEXT_PUBLIC_CRISP_WEBSITE_ID: "test-crisp-website-id"
