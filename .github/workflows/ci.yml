name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  supply-chain:
    name: Supply chain checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install (frozen lockfile, supply-chain policies enforced)
        run: pnpm install --frozen-lockfile

      - name: Audit for known vulnerabilities
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4

  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    needs: supply-chain
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # next lint and next build load next.config.js, which imports src/env.js.
      # SKIP_ENV_VALIDATION bypasses the real env schema check here since CI has
      # no .env; `pnpm test` doesn't need it because vitest.config.ts already
      # injects its own dummy values for the vars tests actually touch.
      - run: pnpm check
        env:
          SKIP_ENV_VALIDATION: "1"

      - run: pnpm test

      - run: pnpm build
        env:
          SKIP_ENV_VALIDATION: "1"
