name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  supply-chain:
    name: Supply chain checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install (frozen lockfile, supply-chain policies enforced)
        run: pnpm install --frozen-lockfile

      - name: Audit for known vulnerabilities
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4

  lint-typecheck:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    needs: supply-chain
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # next lint loads next.config.js, which imports src/env.js. SKIP_ENV_VALIDATION
      # bypasses the real env schema check here since CI has no .env.
      - run: pnpm check
        env:
          SKIP_ENV_VALIDATION: "1"

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: supply-chain
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # No SKIP_ENV_VALIDATION here: vitest.config.ts already injects its own
      # dummy values for the vars tests actually touch.
      - run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: supply-chain
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # next build loads next.config.js, which imports src/env.js. SKIP_ENV_VALIDATION
      # bypasses the real env schema check here since CI has no .env.
      - run: pnpm build
        env:
          SKIP_ENV_VALIDATION: "1"
