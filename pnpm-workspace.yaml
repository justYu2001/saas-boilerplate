allowBuilds:
  esbuild: true
  # No-op without an `msw.workerDirectory` field in package.json.
  # Flip to true if a browser worker is added (pnpm msw init public/).
  msw: false
  sharp: true
  unrs-resolver: true

minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  # Renovate security update: better-auth@1.7.7
  - better-auth@1.7.7
