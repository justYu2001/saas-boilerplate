allowBuilds:
  esbuild: true
  # No-op without an `msw.workerDirectory` field in package.json.
  # Flip to true if a browser worker is added (pnpm msw init public/).
  msw: false
  sharp: true
  unrs-resolver: true

minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  # Renovate security update: next@15.5.27
  - next@15.5.27
